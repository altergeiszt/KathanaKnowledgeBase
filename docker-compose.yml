services:

  # ── GraphRAG API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag_api
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ${LIBRARY_PATH:-./library}:/library:ro
      - lightrag_data:/app/lightrag_data
      # Hot-reload: mount source files so changes reflect without rebuild
      - ./api.py:/app/api.py
      - ./ingest.py:/app/ingest.py
      - ./surrealdb_impl.py:/app/surrealdb_impl.py

  # ── Ingestion worker ──────────────────────────────────────────────────────
  # One-shot job. Run with: docker compose --profile ingest run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag_ingest
    command: python ingest.py --config /app/config.yaml
    env_file: .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      LIBRARY_PATH: /library
    volumes:
      - ${LIBRARY_PATH:-./library}:/library:ro
      - lightrag_data:/app/lightrag_data
      - ./config.yaml:/app/config.yaml:ro
      - ./ingest.py:/app/ingest.py
      - ./surrealdb_impl.py:/app/surrealdb_impl.py
    profiles:
      - ingest

  # ── OpenWebUI ─────────────────────────────────────────────────────────────
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: graphrag_openwebui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://api:8000
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - api

volumes:
  lightrag_data:
  openwebui_data:


# ── Linux: Ollama host resolution ─────────────────────────────────────────
# On Linux, host.docker.internal may not resolve automatically.
# If Ollama is unreachable, add this to the api and ingest services:
#
#   extra_hosts:
#     - "host.docker.internal:host-gateway"