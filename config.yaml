# GraphRAG Assistant — ingestion pipeline config
# Mounted into the ingest container at /app/config.yaml
#
# Precedence (highest wins):  environment / .env  >  this file  >  built-in defaults.
# A value set in BOTH .env and here, with different values, logs a "Config conflict"
# warning at startup (env wins). Secrets (e.g. NEO4J_PASSWORD) belong in .env, not here.

library_path: "E:\\Learning Project Books\\General"
working_dir:  ./lightrag_data

embedding_model: all-MiniLM-L6-v2
ollama_model:    qwen2.5:14b
vector_dim:      384

max_concurrent_inserts: 4
chunk_max_chars:        1500

# CPU-bound extraction worker pool size. Capped well below cpu_count() because
# each worker runs a full docling+EasyOCR pipeline that can need several GB for
# large PDFs; too many workers risks OOM. Override with EXTRACTION_WORKERS.
extraction_workers: 8

dedup_threshold: 0.85
dedup_num_perm:  128
dedup_shingle_k: 5

# Map directory name fragments to content type.
# The pipeline classifies each file by checking if any of these
# keywords appear in its path components (case-insensitive).
# First match wins; falls back to 'selfhelp' (full prose, no special handling).
content_type_rules:
  software: software
  dev:      software
  code:     software
  math:     math
  maths:    math
  self:     selfhelp
  help:     selfhelp
  personal: selfhelp
